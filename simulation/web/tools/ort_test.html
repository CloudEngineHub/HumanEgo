<!doctype html><html><head><meta charset="utf-8"><title>ORT test</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.0/dist/ort.all.min.js"></script></head>
<body><pre id="o"></pre><script type="module">
const log = (s) => { document.getElementById('o').textContent += s + '\n'; console.log(s); };
async function bench(file, ep) {
  try {
    const t0 = performance.now();
    const s = await ort.InferenceSession.create(file, { executionProviders: [ep], graphOptimizationLevel: 'all' });
    const tl = performance.now() - t0;
    const T = (shape, fill) => new ort.Tensor('float32', new Float32Array(shape.reduce((a, b) => a * b)).fill(fill), shape);
    const feeds = { x_rgb: T([1,3,240,320], 0.5), x_ict: T([1,8,20], 0.1), ict_mask: T([1,8], 1), x_t: T([1,50,10], 0.0), t: T([1,1], 0.3), anchor_uv: T([1,2], 0.5) };
    await s.run(feeds);
    const t1 = performance.now();
    for (let i = 0; i < 20; i++) await s.run(feeds);
    log(`${file.split('/').pop()} [${ep}] load ${tl.toFixed(0)} ms, 20 steps ${(performance.now() - t1).toFixed(0)} ms`);
  } catch (e) { log(`${file} [${ep}] ERROR ${e}`); }
}
ort.env.wasm.numThreads = navigator.hardwareConcurrency > 1 && crossOriginIsolated ? 4 : 1;
log(`webgpu: ${!!navigator.gpu}  crossOriginIsolated: ${crossOriginIsolated}  threads: ${ort.env.wasm.numThreads}`);
for (const f of ['../assets/policy/serve_bread_int8.onnx', '../assets/policy/serve_bread_full.onnx']) {
  await bench(f, 'wasm');
  if (navigator.gpu) await bench(f, 'webgpu');
}
window.__done = 1;
</script></body></html>
