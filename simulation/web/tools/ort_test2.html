<!doctype html><html><head><meta charset="utf-8"><title>ORT rollout test</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.0/dist/ort.all.min.js"></script></head>
<body><pre id="o"></pre><script type="module">
const log = (s) => { document.getElementById('o').textContent += s + '\n'; console.log(s); };
const T = (shape, fill) => new ort.Tensor('float32', new Float32Array(shape.reduce((a, b) => a * b)).fill(fill), shape);
for (const f of ['serve_bread_rollout20_fp16.onnx', 'serve_bread_rollout10_fp16.onnx']) {
  for (const ep of ['webgpu', 'wasm']) {
    try {
      const s = await ort.InferenceSession.create('../assets/policy/' + f, { executionProviders: [ep] });
      const feeds = { x_rgb: T([1,3,240,320], 0.5), x_ict: T([1,8,20], 0.1), ict_mask: T([1,8], 1), anchor_uv: T([1,2], 0.5), noise: T([1,50,10], 0.1) };
      await s.run(feeds);
      const t0 = performance.now(); for (let i = 0; i < 5; i++) await s.run(feeds);
      log(`${f} [${ep}] ${((performance.now() - t0) / 5).toFixed(0)} ms / re-plan`);
    } catch (e) { log(`${f} [${ep}] ERROR ${e}`); }
  }
}
window.__done = 1;
</script></body></html>
