# CPU-only test subset of the HumanEgo simulation (no checkpoint, no GPU, no OpenGL):
# config profiles, grasp-skill state machine, driver IK, perception geometry, web build / packing.
# The closed-loop smoke episodes (`-m sim`) skip themselves here; run them locally with the checkpoint.
name: sim-tests

on:
  push:
    branches: [main]
    paths:
      - "simulation/**"
      - "inference/**"
      - "preprocess/**"
      - "utils/**"
      - "training/FlowMatchingModel.py"
      - "cfg/**"
      - ".github/workflows/sim-tests.yml"
  pull_request:
    paths:
      - "simulation/**"
      - "inference/**"
      - "preprocess/**"
      - "utils/**"
      - "training/FlowMatchingModel.py"
      - "cfg/**"
      - ".github/workflows/sim-tests.yml"
  workflow_dispatch:

concurrency:
  group: sim-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MUJOCO_GL: disable          # nothing in the CPU subset renders
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: simulation/requirements-ci.txt
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r simulation/requirements-ci.txt
      - name: Tests
        run: pytest simulation/tests -m "not sim" -q -rs
